<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Museum Ovartaci - Quiz</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gotu&family=Jua&family=Yrsa:ital,wght@0,300..700;1,300..700&display=swap"
      rel="stylesheet"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Afacad:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div class="container-ipad">
      <div class="hvid-boks">
        <div id="start-skaerm" class="skaerm-sektion aktiv">
          <h1>Hvem minder <span class="du">du</span> om?</h1>
          <div class="undertekst">
            <p>
              Tag quizzen og find ud af hvilken af Ovartacis dukker, du minder
              mest om.
            </p>
          </div>
          <img src="img/forside.gif" alt="forside gif" class="forside-gif" />
          <button class="start-knap" id="start-quiz-btn">Start Quiz</button>
          <img src="img/haand.png" alt="haand" class="haand" />
        </div>

        <!--quiz skærm-->
        <div id="quiz-skaerm" class="skaerm-sektion">
          <div class="progress-container">
            <div id="progress-bar" class="progress-bar"></div>
          </div>

          <h2 id="spg-tekst">Spørgsmål</h2>

          <div id="svar-knap-container"></div>

          <!-- Tilbage-knap -->
          <a href="index.html" class="tilbage-knap">
            <span class="tilbage-pil"></span>
            <img src="img/tilbage.png" alt="tilbage" class="tilbage-forside" />
            Tilbage til forsiden
          </a>
        </div>

        <!--loading skærm-->
        <div id="vente-side" class="skaerm-sektion">
          <div class="du-er"><p>Du er...</p></div>
          <img src="img/vente.gif" alt="vente gif" class="vente-gif" />
        </div>

        <!--resultat skærm-->
        <div id="resultat-skaerm" class="skaerm-sektion">
          <p class="du-er-tekst">Du er...</p>
          <h2 id="dukke-navn">Dukkens navn</h2>

          <img
            class="dukke-baggrund"
            src="#"
            alt="baggrund på dukke bevæger sig"
            id="dukke-vinger"
          />

          <div class="dukke">
            <img
              class="dukke-billede"
              src="#"
              alt="billede af dukke"
              id="dukke-billede"
            />
          </div>

          <div class="hvorfor-box" id="hvorfor-knap">
            <span class="hvorfor-tekst">Hvorfor?</span>
            <img class="pil-videre" src="img/pil-videre.png" alt="pil videre" />
          </div>

          <!--popup-kort med info om dukker-->
          <div id="popup-kort" class="popup-container skjult">
            <div class="popup-indhold">
              <span class="luk-popup" id="luk-popup-knap">&times;</span>

              <h2 id="popup-dukke-navn">Dukkens navn</h2>
              <p id="dukke-beskrivelse">Beskrivelse af dukke</p>

              <button id="tagBilledeKnap" class="tag-billede-knap">
                <img
                  src="img/kamera-ikon.svg"
                  alt="kamera"
                  class="kamera-ikon"
                />
                Tag billede
              </button>
            </div>
          </div>

          <a href="index.html" class="tilbage-knap">
            <span class="tilbage-pil"></span>
            <img src="img/tilbage.png" alt="tilbage" class="tilbage-forside" />
            Tilbage til forsiden
          </a>
        </div>
        <!-- Kamera-ramme -->
        <div id="kamera-skaerm" class="skaerm-sektion" style="display: none">
          <div class="kamera-ramme">
            <video id="kamera" autoplay playsinline></video>

            <canvas id="canvas"></canvas>

            <button id="kameraKnap" type="button" class="kamera-knap">
              <img src="img/kamera.png" alt="Tag billede" />
            </button>
          </div>

          <!-- Resultat-visning — UDENFOR kamera-ramme! -->
          <div class="resultat-visning" id="resultatVisning">
            <div class="polaroid-wrapper">
              <img
                id="tagetBillede"
                class="taget-billede"
                alt="Dit billede"
                src="img/placeholder.png"
              />
              <div class="polaroid-bund">
                <img
                  src="img/logo.png"
                  class="polaroid-logo"
                  alt="Museum Ovartaci logo"
                />
              </div>
            </div>
            <div class="deling-sektion">
              <input
                type="tel"
                id="telefonInput"
                class="telefon-input"
                placeholder="Indtast telefonnummer..."
              />
              <button id="delingKnap" type="button" class="deling-knap">
                <img src="img/del.png" alt="Del" class="deling-ikon" />
              </button>
            </div>
          </div>

          <!-- Tilbage-knap -->
          <a href="index.html" class="tilbage-knap">
            <span class="tilbage-pil">&#8249;</span>
            Tilbage til forsiden
          </a>
        </div>
      </div>
    </div>
    <script src="js/script.js"></script>
  </body>
</html>
